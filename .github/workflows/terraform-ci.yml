name: Terraform CI

on:
  push:
    branches:
      - 'feature/**'

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./di-b18-infra

    steps:

      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      # Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Terraform Format Check
      - - name: Terraform Format Check
          working-directory: ./di-b18-infra
          run: terraform fmt -check -recursive

          name: Terraform Init
          working-directory: ./di-b18-infra
          run: terraform init

          name: Terraform Validate
          working-directory: ./di-b18-infra
          run: terraform validate

          name: Terraform Plan
          working-directory: ./di-b18-infra
          run: terraform plan