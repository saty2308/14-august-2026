```yaml
trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Terraform root module
  terraformWorkingDirectory: '$(System.DefaultWorkingDirectory)/di-b18-infra/environments/preprod'

  # Terraform version
  terraformVersion: 'latest'

  # Replace this with your actual Azure DevOps Service Connection name
  azureServiceConnection: 'YOUR-AZURE-SERVICE-CONNECTION'

stages:

# ============================================================
# TERRAFORM PLAN - PREPROD
# ============================================================

- stage: TerraformPlan
  displayName: 'Terraform Plan - Preprod'

  jobs:
    - job: TerraformPlan
      displayName: 'Terraform Plan'

      steps:

        # ======================================================
        # CHECKOUT
        # ======================================================

        - checkout: self
          displayName: 'Checkout Repository'
          clean: true

        # ======================================================
        # SETUP TERRAFORM
        # ======================================================

        - task: TerraformInstaller@1
          displayName: 'Setup Terraform'
          inputs:
            terraformVersion: '$(terraformVersion)'

        # ======================================================
        # CHECK TERRAFORM VERSION
        # ======================================================

        - script: |
            terraform version
          displayName: 'Terraform Version'

        # ======================================================
        # CHECK TERRAFORM FILES
        # ======================================================

        - script: |
            echo "Terraform Working Directory:"
            echo "$(terraformWorkingDirectory)"

            echo ""
            echo "Terraform files:"
            find "$(terraformWorkingDirectory)" -maxdepth 1 -type f -name "*.tf" -print
          displayName: 'Check Terraform Configuration'

        # ======================================================
        # TERRAFORM FORMAT
        # ======================================================

        - task: TerraformCLI@1
          displayName: 'Terraform Format Check'
          inputs:
            command: 'fmt'
            workingDirectory: '$(terraformWorkingDirectory)'
            commandOptions: '-check'

        # ======================================================
        # TERRAFORM INIT
        # ======================================================

        - task: TerraformCLI@1
          displayName: 'Terraform Init'
          inputs:
            command: 'init'
            workingDirectory: '$(terraformWorkingDirectory)'
            environmentServiceNameAzureRM: '$(azureServiceConnection)'

        # ======================================================
        # TERRAFORM VALIDATE
        # ======================================================

        - task: TerraformCLI@1
          displayName: 'Terraform Validate'
          inputs:
            command: 'validate'
            workingDirectory: '$(terraformWorkingDirectory)'

        # ======================================================
        # TERRAFORM PLAN
        # ======================================================

        - task: TerraformCLI@1
          displayName: 'Terraform Plan'
          inputs:
            command: 'plan'
            workingDirectory: '$(terraformWorkingDirectory)'
            environmentServiceNameAzureRM: '$(azureServiceConnection)'
            commandOptions: '-out=tfplan'

        # ======================================================
        # PUBLISH TERRAFORM PLAN
        # ======================================================

        - task: PublishPipelineArtifact@1
          displayName: 'Publish Terraform Plan'
          inputs:
            targetPath: '$(terraformWorkingDirectory)/tfplan'
            artifact: 'terraform-plan-preprod'
            publishLocation: 'pipeline'
```
